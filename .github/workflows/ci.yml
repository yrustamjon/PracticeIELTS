name: Tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_USER: practiceielts
          POSTGRES_DB: practiceielts
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U practiceielts" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://practiceielts:ci-local-only@127.0.0.1:5432/practiceielts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: backend/.venv/bin/python backend/manage.py check
      - run: backend/.venv/bin/pytest backend/tests -q
      - run: backend/.venv/bin/python backend/manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run && npm run build
        working-directory: frontend
