server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 110m;
    root /home/PracticeIELTS/frontend/dist;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Module workers are rejected by browsers with application/octet-stream.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Vite fingerprints these files; a new build gets new URLs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host localhost;
    }
    location /static/ { alias /home/PracticeIELTS/backend/staticfiles/; }
    location /media/ { return 404; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
